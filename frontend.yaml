server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: CAMPUSDESKSESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  thymeleaf:
    cache: true
  mvc:
    log-request-details: false

app:
  gateway-url: ${GATEWAY_URL:http://localhost:8088}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info