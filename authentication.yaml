server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/campusdesk_auth
    username: root
    password: 2005admin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR

  Jackson:
    deserialization:
      fail-on-unknown-properties: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info