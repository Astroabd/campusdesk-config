server:
  port: 8088

spring:
  cloud:
    loadbalancer:
      cache:
        enabled: false

    gateway:
      server:
        webmvc:
          routes:
            - id: authentication
              uri: lb://authentication
              predicates:
                - Path=/api/v1/auth/**

            - id: tickets
              uri: lb://ticket
              predicates:
                - Path=/api/v1/tickets/**

            - id: knowledge
              uri: lb://knowledge
              predicates:
                - Path=/api/v1/guides/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info